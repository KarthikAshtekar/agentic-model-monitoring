[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-model-monitoring"
version = "0.1.0"
description = "Foundation for an Agentic Model Risk & Monitoring Copilot."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Karthik" },
]
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-groq>=1.0,<2.0",
    "pydantic>=2",
    "pydantic-settings",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "xgboost==3.2.0",
    "pyarrow",
    "duckdb",
    "joblib",
    "PyYAML",
    "typer",
    "rich",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
monitoring-verify = "monitoring_agent.paths:print_project_paths"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["default"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    ".ipynb_checkpoints",
    "data",
    "artifacts",
    "reports/generated",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/monitoring_agent"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true
