identity:
  model_id: credit_default
  display_name: Credit Default XGBoost
  model_version: 1.0.0
  task_type: binary_classification
  adapter_type: sklearn_binary_classifier
  domain_id: credit_risk

business_context:
  use_case: Academic next-month credit-default risk monitoring
  prediction_unit: credit-card account record
  positive_outcome: next-month credit default
  prediction_horizon: next month
  decision_context: governed model-risk review of threshold-based risk scores
  business_owner: null

bundle_paths:
  model_artifact: artifacts/models/credit_default_pipeline.joblib
  feature_schema: artifacts/metadata/feature_schema.json
  reference_features: data/reference/reference_features.parquet
  reference_labels: data/reference/reference_labels.parquet
  reference_predictions: data/reference/reference_predictions.parquet
  reference_metrics: artifacts/baselines/reference_metrics.json
  reference_feature_summary: artifacts/baselines/reference_feature_summary.parquet
  bundle_manifest: artifacts/metadata/bundle_manifest.json

prediction_contract:
  score_method: predict_proba
  positive_class: 1
  positive_class_index: 1
  default_threshold: 0.50
  operating_threshold: 0.25

data_contract:
  identifier_column: record_id
  target_column: Default_Flag
  ordered_features:
    - LIMIT_BAL
    - EDUCATION
    - MARRIAGE
    - AGE
    - PAY_0
    - PAY_2
    - PAY_3
    - PAY_4
    - PAY_5
    - PAY_6
    - BILL_AMT1
    - BILL_AMT2
    - BILL_AMT3
    - BILL_AMT4
    - BILL_AMT5
    - BILL_AMT6
    - PAY_AMT1
    - PAY_AMT2
    - PAY_AMT3
    - PAY_AMT4
    - PAY_AMT5
    - PAY_AMT6
    - BillToLimitRatio_1
    - BillToLimitRatio_2
    - BillToLimitRatio_3
    - BillToLimitRatio_4
    - BillToLimitRatio_5
    - BillToLimitRatio_6
    - AvgBillToLimitRatio
    - AvgPaymentToBillRatio
    - RecentPaymentDelay
    - MaxPaymentDelay
    - NumDelayedMonths
    - AvgBillAmount
    - AvgPaymentAmount
    - PaymentToLimitRatio
  numeric_features:
    - LIMIT_BAL
    - AGE
    - PAY_0
    - PAY_2
    - PAY_3
    - PAY_4
    - PAY_5
    - PAY_6
    - BILL_AMT1
    - BILL_AMT2
    - BILL_AMT3
    - BILL_AMT4
    - BILL_AMT5
    - BILL_AMT6
    - PAY_AMT1
    - PAY_AMT2
    - PAY_AMT3
    - PAY_AMT4
    - PAY_AMT5
    - PAY_AMT6
    - BillToLimitRatio_1
    - BillToLimitRatio_2
    - BillToLimitRatio_3
    - BillToLimitRatio_4
    - BillToLimitRatio_5
    - BillToLimitRatio_6
    - AvgBillToLimitRatio
    - AvgPaymentToBillRatio
    - RecentPaymentDelay
    - MaxPaymentDelay
    - NumDelayedMonths
    - AvgBillAmount
    - AvgPaymentAmount
    - PaymentToLimitRatio
  categorical_features:
    - EDUCATION
    - MARRIAGE
  integer_constrained_features:
    - LIMIT_BAL
    - EDUCATION
    - MARRIAGE
    - AGE
    - PAY_0
    - PAY_2
    - PAY_3
    - PAY_4
    - PAY_5
