identity:
  model_id: diabetes_risk
  display_name: BRFSS Diabetes Risk XGBoost
  model_version: 1.0.0
  task_type: binary_classification
  adapter_type: sklearn_binary_classifier
  domain_id: diabetes_screening

business_context:
  use_case: survey-based diabetes-risk screening
  prediction_unit: BRFSS respondent screening record
  positive_outcome: diabetes-positive class
  prediction_horizon: cross-sectional reported diabetes status
  decision_context: governed screening-model review; not diagnosis or treatment
  business_owner: null

bundle_paths:
  model_artifact: registered_models/diabetes_risk/artifacts/model.joblib
  feature_schema: registered_models/diabetes_risk/artifacts/feature_schema.json
  reference_features: registered_models/diabetes_risk/reference/features.parquet
  reference_labels: registered_models/diabetes_risk/reference/labels.parquet
  reference_predictions: registered_models/diabetes_risk/reference/predictions.parquet
  reference_metrics: registered_models/diabetes_risk/baselines/reference_metrics.json
  reference_feature_summary: registered_models/diabetes_risk/baselines/reference_feature_summary.parquet
  bundle_manifest: registered_models/diabetes_risk/artifacts/bundle_manifest.json

prediction_contract:
  score_method: predict_proba
  positive_class: 1
  positive_class_index: 1
  default_threshold: 0.50
  operating_threshold: 0.25

data_contract:
  identifier_column: record_id
  target_column: Diabetes_binary
  ordered_features:
    - HighBP
    - HighChol
    - CholCheck
    - BMI
    - Smoker
    - Stroke
    - HeartDiseaseorAttack
    - PhysActivity
    - Fruits
    - Veggies
    - HvyAlcoholConsump
    - AnyHealthcare
    - NoDocbcCost
    - GenHlth
    - MentHlth
    - PhysHlth
    - DiffWalk
    - Sex
    - Age
    - Education
    - Income
  numeric_features:
    - BMI
    - MentHlth
    - PhysHlth
  categorical_features:
    - HighBP
    - HighChol
    - CholCheck
    - Smoker
    - Stroke
    - HeartDiseaseorAttack
    - PhysActivity
    - Fruits
    - Veggies
    - HvyAlcoholConsump
    - AnyHealthcare
    - NoDocbcCost
    - GenHlth
    - DiffWalk
    - Sex
    - Age
    - Education
    - Income
  integer_constrained_features:
    - HighBP
    - HighChol
    - CholCheck
    - BMI
    - Smoker
    - Stroke
    - HeartDiseaseorAttack
    - PhysActivity
    - Fruits
    - Veggies
    - HvyAlcoholConsump
    - AnyHealthcare
    - NoDocbcCost
    - GenHlth
    - MentHlth
    - PhysHlth
    - DiffWalk
    - Sex
    - Age
    - Education
    - Income
  nullable_features: []
  preprocessed_feature_count: 52
  preprocessing_representation: 21 raw BRFSS indicators plus 31 deterministic engineered features

monitoring_policy:
  minimum_batch_size: 200
  minimum_labelled_samples: 200
  primary_metrics:
    - recall
    - precision
    - f1
    - roc_auc
    - pr_auc
    - brier_score
  feature_drift_thresholds:
    discrete_unique_count_max: 20
    psi_warning: 0.10
    psi_critical: 0.25
    js_warning: 0.10
    js_critical: 0.20
    unseen_category_rate_warning: 0.01
    unseen_category_rate_critical: 0.05
    ks_statistic_warning: 0.10
    ks_statistic_critical: 0.20
  prediction_drift_thresholds:
    probability_psi_warning: 0.10
    probability_psi_critical: 0.25
    positive_rate_absolute_change_warning: 0.05
    positive_rate_absolute_change_critical: 0.10
    ks_statistic_warning: 0.10
  performance_thresholds:
    recall_drop_warning: 0.08
    recall_drop_critical: 0.15
    precision_drop_warning: 0.08
    precision_drop_critical: 0.15
    f1_drop_warning: 0.06
    f1_drop_critical: 0.12
    pr_auc_drop_warning: 0.05
    pr_auc_drop_critical: 0.10
    roc_auc_drop_warning: 0.05
    roc_auc_drop_critical: 0.10
    brier_increase_warning: 0.03
    brier_increase_critical: 0.06

governance:
  require_human_approval: true
  protected_attributes:
    - Sex
    - Age
    - Education
    - Income
  allowed_action_types:
    - no_action
    - continue_monitoring
    - quarantine_batch
    - investigate_data_pipeline
    - investigate_feature_drift
    - collect_more_labels
    - evaluate_threshold
    - evaluate_recalibration
    - evaluate_retraining
    - run_challenger_in_shadow
    - escalate_model_governance
  prohibited_automatic_actions:
    - automatic deployment
    - automatic rollback
    - automatic retraining
    - autonomous clinical action
    - diagnosis
    - treatment

provenance:
  source_project: 25BM6JP22 BRFSS project (source path documented in onboarding report)
  source_commit: 7016f3fd7e5e33a5884c2bdf4c05c98d2b21e0e5
  source_worktree_clean: true
  source_artifact_paths:
    - models/brfss_final/final_binary_xgboost.joblib
    - models/brfss_final/binary_probability_calibrator.joblib
    - data/processed/brfss_test_set.csv.gz
    - reports/brfss_final/tables/binary_test_predictions.csv
    - reports/brfss_final/tables/final_test_metrics_binary.csv
    - reports/brfss_final/tables/binary_threshold_analysis.csv
    - reports/brfss_final/run_summary.json
    - reports/brfss_final/MODEL_CARD.md
  bundle_created_at_utc: "2026-07-25T00:00:00Z"
  bundle_mode: live_inference
  limitations:
    - BRFSS features and outcomes are self-reported survey variables from 2015.
    - The model is a screening research model, not a diagnostic or treatment system.
    - The held-out reference is an internal stratified split with no external validation.
    - The source XGBoost 3.3 joblib is exported under the monitoring runtime XGBoost 3.2 after score reproduction.
